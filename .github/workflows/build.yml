name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Clean Android Project & Auto Create Icon
        run: |
          mkdir -p PagesApp/app/src/main/java/com/pageshub/app
          mkdir -p PagesApp/app/src/main/res/mipmap
          cd PagesApp

          # 1. BUAT FILE ICON VECTOR DARI TEKS OTOMATIS
          cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <defs>
              <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0f172a"/>
                <stop offset="100%" stop-color="#1e293b"/>
              </linearGradient>
              <linearGradient id="cfGrad" x1="0%" y1="0%" x2="100%" y2="80%">
                <stop offset="0%" stop-color="#f97316"/>
                <stop offset="100%" stop-color="#ea580c"/>
              </linearGradient>
              <linearGradient id="nlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="100%" stop-color="#0284c7"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
            <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4"/>
            <path d="M372 320c28.7 0 52-23.3 52-52 0-26.2-19.4-47.8-44.8-51.4-4.8-44.5-42.5-79.1-88.7-79.1-39.6 0-73 25.5-84.5 61.1-7.2-4.5-15.7-7.1-24.8-7.1-26.5 0-48 21.5-48 48 0 3.2.3 6.3.9 9.3C109.8 253.2 92 274.6 92 300c0 28.7 23.3 52 52 52h228c2.7 0 5.3-.2 7.9-.6-2.6-10.4-3.9-21.2-3.9-32.4 0-27.1 8.2-52.3 22.3-73.2-6.5 3.3-13.8 5.2-21.5 5.2-24.3 0-44-19.7-44-44 0-3.6.4-7.1 1.3-10.4-2.4-.4-4.8-.6-7.3-.6-22.1 0-40 17.9-40 40 0 2.2.2 4.4.5 6.5C270.8 250 256 269.3 256 292c0 2.7.2 5.4.7 8H372z" fill="url(#cfGrad)"/>
            <path d="M256 300 L340 370 L420 310" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" fill="none"/>
            <path d="M340 370 L340 430" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>
            <circle cx="256" cy="300" r="16" fill="#ffffff" stroke="#0284c7" stroke-width="6"/>
            <circle cx="420" cy="310" r="16" fill="#ffffff" stroke="#0284c7" stroke-width="6"/>
            <circle cx="340" cy="430" r="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="6"/>
            <circle cx="340" cy="370" r="26" fill="url(#nlGrad)" stroke="#ffffff" stroke-width="6"/>
            <circle cx="340" cy="370" r="9" fill="#ffffff"/>
          </svg>
          EOF

          # 2. SERVER GITHUB MENGUBAH SVG MENJADI PNG
          sudo apt-get update && sudo apt-get install -y inkscape
          inkscape icon.svg -o app/src/main/res/mipmap/ic_launcher.png -w 512 -h 512

          # 3. Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 4. settings.gradle
          cat << 'EOF' > settings.gradle
          include ':app'
          rootProject.name = "PagesHub"
          EOF

          # 5. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pageshub.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.pageshub.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          # 6. AndroidManifest.xml (Icon Aktif + Status Bar Jam Sinyal Normal)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:label="PagesHub"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. MainActivity.java
          cat << 'EOF' > app/src/main/java/com/pageshub/app/MainActivity.java
          package com.pageshub.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView myWebView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  myWebView = new WebView(this);
                  setContentView(myWebView);

                  WebSettings settings = myWebView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  myWebView.setWebViewClient(new WebViewClient());
                  myWebView.loadUrl("https://cfpagenodeloc.pages.dev/");
              }

              @Override
              public void onBackPressed() {
                  if (myWebView != null && myWebView.canGoBack()) {
                      myWebView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          cd PagesApp
          gradle assembleDebug --no-daemon

      - name: Upload APK Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: PagesHub-APK
          path: PagesApp/app/build/outputs/apk/debug/*.apk
